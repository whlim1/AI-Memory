[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-pipeline"
version = "0.1.0"
description = "Ingestion pipeline for the AI Memory system: chunking, PII redaction, semantic summarization, metadata extraction, and Qdrant storage."
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.7,<1.8",
    "sentence-transformers>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["ai_memory_pipeline"]
