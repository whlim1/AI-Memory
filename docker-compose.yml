# =============================================================================
# AI Memory Pipeline - Full Production Deployment
# =============================================================================
# Design refs : D:\AI-Memory\System-Architecture.md
#               D:\AI-Memory\Decisions.md
#
# Architecture: NAS-hosted deployment
#   - All services run on NAS (192.168.0.16)
#   - Qdrant for vector storage and retrieval
#   - Pipeline services for processing documents
#   - Shared memory access via \\192.168.0.16\SharedMemory
#
# Usage:
#   docker compose up -d            # Start all services
#   docker compose ps               # Check status
#   docker compose logs -f <service> # Monitor logs
#   docker compose down             # Stop (data persists)
# =============================================================================

volumes:
  qdrant_storage:
    name: ai-memory-qdrant-storage
  qdrant_config:
    name: ai-memory-qdrant-config
  qdrant_backups:
    name: ai-memory-qdrant-backups
  shared_memory:
    name: ai-memory-shared-memory
  pipeline_logs:
    name: ai-memory-pipeline-logs
  pipeline_config:
    name: ai-memory-pipeline-config

services:
  # =============================================================================
  # Qdrant - Vector Database (Primary Storage Layer)
  # Location: NAS /docker/qdrant
  # Volumes: Named volumes for Portainer compatibility
  # =============================================================================
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: AI-Memory-qdrant
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC API
    volumes:
      # Vector storage, WAL, and snapshots on NAS (volume3)
      - qdrant_storage:/qdrant/storage
      # Configuration (read-only from host)
      - qdrant_config:/qdrant/config:ro
      # Backups for disaster recovery
      - qdrant_backups:/qdrant/backups
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=info
    # Health check disabled due to wget availability issues in container
    # Qdrant is running correctly on ports 6333/6334 as verified by logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# AI Memory Pipeline - Shared Services Container
# Location: NAS (all services in single container for simplicity)
# Mounts: SharedMemory and repositories accessible via SMB paths
# =============================================================================
  ai-memory-pipeline:
    image: ghcr.io/whlim1/ai-memory-pipeline:latest
    container_name: AI-Memory-pipeline
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      # Shared memory for you and your wife (read-write) - mapped to named volume
      - shared_memory:/shared_memory:rw
      # Pipeline logs on NAS (volume3)
      - pipeline_logs:/app/logs:rw
      # Configuration from NAS (volume3)
      - pipeline_config:/app/config:ro
    environment:
      # Qdrant connection (same host, use container name)
      - QDRANT_URL=http://qdrant:6333
      # Shared memory paths
      - SHARED_MEMORY_PATH=/shared_memory
      - MY_DOCUMENTS=/shared_memory/me
      - WIFE_DOCUMENTS=/shared_memory/wife
      - SHARED_DOCUMENTS=/shared_memory/shared
      # LM Studio connection (Windows host on network - set via .env)
      - LM_STUDIO_URL=${LM_STUDIO_URL}
      # Processing configuration
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - VECTOR_SIZE=768
      - EXACT_THRESHOLD=0.95
      - FUZZY_THRESHOLD=0.85
      # Logging
      - LOG_LEVEL=info
    ports:
      - "8001:8000"   # API Gateway (changed from 8000 to avoid conflict with Portainer internal service)
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# OpenWebUI is deployed as a separate stack (open-webui project) for independent lifecycle.
# To integrate it into this compose file, add here with OLLAMA_BASE_URL available in environment.

networks:
  default:
    name: AI-Memory-network
    driver: bridge
