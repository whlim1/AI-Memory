services:
  # === Core Services === #
  prometheus:
    image: prom/prometheus:latest
    container_name: mon_prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - /volume1/docker/compose/43/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: mon_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ACTIVE=false
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: mon_node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped
    networks:
      - monitoring

  qdrant-exporter:
    image: baselhusam/qdrant-exporter:latest
    container_name: mon_qdrant_exporter
    ports:
      - "8888:9153"
    environment:
      - QDRANT_EXPORTER_QDRANT__NODES=[{"url":"http://192.168.0.16:6333"}]
    restart: unless-stopped
    networks:
      - monitoring

  # === Phase 5 Services (from GHCR) === #

  embedding-quality-monitor:
    image: ghcr.io/whlim1/aiplatform:embedding-quality-monitor
    container_name: mon_embedding_quality_monitor
    environment:
      - PYTHONUNBUFFERED=1
      - EQM_QUALITY_THRESHOLD=0.85
      - EQM_DRIFT_THRESHOLD=0.10
      - EQM_CHECK_INTERVAL=3600
      - EQM_HISTORY_SIZE=1000
      - QDRANT_HOST=192.168.0.16
      - QDRANT_PORT=6333
    # One-shot demo: runs to completion and exits 0. Do not auto-restart.
    restart: "no"
    networks:
      - monitoring

  model-caching-strategy:
    image: ghcr.io/whlim1/aiplatform:model-caching-strategy
    container_name: mon_model_caching_strategy
    environment:
      - PYTHONUNBUFFERED=1
      - MCM_MAX_CACHE_SIZE=2
      - MCM_EVICTION_POLICY=lru
      - MCM_PERSIST_CACHE=true
      # LM Studio runs on the inference PC (this Windows host), not the NAS.
      - LM_STUDIO_URL=http://192.168.0.19:1234
      # Authentication for GHCR image pull (if private)
      - IMAGE_PULL_REGISTRY=ghcr.io
    # One-shot demo: runs to completion and exits 0. Do not auto-restart.
    restart: "no"
    networks:
      - monitoring

  dynamic-chunking-service:
    image: ghcr.io/whlim1/aiplatform:dynamic-chunking-service
    container_name: mon_dynamic_chunking_service
    environment:
      - PYTHONUNBUFFERED=1
      - DCS_DEFAULT_CHUNK_SIZE=500
      - DCS_OVERLAP_RATIO=0.1
      - DCS_CODE_CHUNK_SIZE=300
      - DCS_PROSE_CHUNK_SIZE=600
    # One-shot demo: runs to completion and exits 0. Do not auto-restart.
    restart: "no"
    networks:
      - monitoring

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  monitoring:
    driver: bridge
