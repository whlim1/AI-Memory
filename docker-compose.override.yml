# =============================================================================
# Service Configuration - docker-compose.override.yml
# =============================================================================
# This file overrides docker-compose.yml settings for local development
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.yml up
# =============================================================================

services:
  # API Gateway — unified entry point for all pipeline services
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: python -m uvicorn services.gateway:app --host 0.0.0.0 --port 8001
    ports:
      - "8002:8001"   # Expose gateway on host port 8002 (8001 is used by main pipeline API)
    environment:
      - QDRANT_URL=http://192.168.160.2:6333
      - LM_STUDIO_URL=192.168.0.19:1234
      - LOG_LEVEL=debug

  # Deduplication service — document dedup and cleanup
  deduplication:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: python -m uvicorn services.deduplication_service:app --host 0.0.0.0 --port 8001
    environment:
      - QDRANT_URL=http://192.168.160.2:6333
      - LOG_LEVEL=debug

  # Chunking service — document splitting and tokenization
  chunking:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: python -m uvicorn services.dynamic_chunking_service:app --host 0.0.0.0 --port 8001
    environment:
      - QDRANT_URL=http://192.168.160.2:6333
      - LM_STUDIO_URL=192.168.0.19:1234
      - LOG_LEVEL=debug

  # Embedding service — vector embedding generation
  embedding:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: python -m uvicorn services.embedding_quality_monitor:app --host 0.0.0.0 --port 8001
    environment:
      - QDRANT_URL=http://192.168.160.2:6333
      - LM_STUDIO_URL=192.168.0.19:1234
      - LOG_LEVEL=debug

  # Model cache service — LLM model caching and management
  model-cache:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: python -m uvicorn services.model_caching_strategy:app --host 0.0.0.0 --port 8001
    environment:
      - QDRANT_URL=http://192.168.160.2:6333
      - LM_STUDIO_URL=192.168.0.19:1234
      - LOG_LEVEL=debug
